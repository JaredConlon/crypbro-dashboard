<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypbro</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --surface-2: #f3f2ee; --border: #e3e2dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #75746f; --grid: #e8e7e1;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4;
  --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --good: #0a7a3e; --bad: #c62f2e; --warn: #9a6500;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #242423; --border: #363633;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #9b9a90; --grid: #30302d;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181;
    --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --good: #4cc38a; --bad: #f07a79; --warn: #e0a93a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 15px; margin: 32px 0 10px; }
.note { color: var(--text-2); font-size: 13px; }
.status { margin-left: auto; font-size: 13px; color: var(--text-2); }
.status b { font-weight: 600; }
.status .ok { color: var(--good); } .status .warn { color: var(--warn); } .status .bad { color: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--surface); }
.card h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; }
.key { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.card .sub { color: var(--text-3); font-size: 12px; margin-bottom: 8px; }
.headline { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }
.big { font-size: 24px; font-weight: 600; line-height: 1.2; }
/* The change and its dollar amount stay together: if they don't fit beside the balance, both move below it. */
.delta { font-size: 13px; color: var(--text-2); white-space: nowrap; }
dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 10px 0 0; font-size: 13px; }
dt { color: var(--text-2); } dd { margin: 0; text-align: right; }
dd.withdrawn { color: var(--good); font-weight: 700; }
.chart { position: relative; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.chart svg { display: block; width: 100%; height: 280px; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row b { margin-left: auto; padding-left: 12px; font-weight: 600; }
.empty { color: var(--text-2); padding: 40px 8px; text-align: center; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-2); font-weight: 500; background: var(--surface-2); white-space: nowrap; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; }
td { white-space: nowrap; }
.pos { color: var(--good); } .neg { color: var(--bad); }
/* The Bitcoin low watch: market readings in a section of their own, tinted so they don't read as paper accounts. */
a.note.on { color: var(--good); font-weight: 600; } a.note.stale { color: var(--warn); }
.signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.sign { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; background: var(--surface-2); }
.sign h3 { margin: 0; font-size: 14px; font-weight: 600; }
.sign .state { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 2px 0 6px; }
.sign .state.pos { color: var(--good); } .sign .state.stale { color: var(--warn); }
.sign .detail { font-size: 13px; color: var(--text-2); }
.long { font-weight: 600; } .short { font-weight: 600; }
</style>
</head>
<body data-static="1">
<main>
  <header>
    <h1 id="page-title">Crypbro</h1>
    <span class="note">Paper trading: simulated money on live Hyperliquid prices</span>
    <a class="note" id="team-link" href="/b-team">B-team</a>
    <a class="note" id="locked-link" href="/locked">Locked test</a>
    <a class="note" id="watch-link" href="#low-watch">Low watch</a>
    <span class="status" id="status" role="status">Loading…</span>
  </header>
  <section class="cards" id="cards" aria-label="Paper accounts"></section>

  <h2>Return since start</h2>
  <div class="chart" id="chart">
    <div class="legend" id="legend"></div>
    <svg id="plot" role="img" aria-label="Return of each paper account over time"></svg>
    <div class="tip" id="tip"></div>
  </div>

  <h2>Open positions</h2>
  <div class="table-wrap"><table id="positions"></table></div>
  <h2>Latest signals</h2>
  <div class="table-wrap"><table id="signals"></table></div>
  <h2>Closed trades</h2>
  <div class="table-wrap"><table id="trades"></table></div>

  <h2 id="low-watch">Bitcoin low watch</h2>
  <div class="note" id="watch-note">Three signs that Bitcoin's fall may be ending. Market readings, not a model.</div>
  <section class="signs" id="signs" aria-label="Signs that Bitcoin's fall may be ending"></section>
</main>
<script>
// The published copy on GitHub Pages reads saved files, which are refreshed every 10 minutes.
const STATIC = document.body.dataset.static === "1";
const IS_B_TEAM = STATIC ? location.pathname.includes("/b-team") : location.pathname.startsWith("/b-team");
const teamLink = document.getElementById("team-link");
if (!STATIC) {
  // The real-money page exists on this computer only, so the published copy never links to it.
  document.getElementById("locked-link").after(" ", el("a", {class: "note", href: "/live"}, "Real money"));
}
if (STATIC) {
  teamLink.href = "b-team/";
  document.getElementById("locked-link").href = IS_B_TEAM ? "../locked/" : "locked/";
  document.querySelector("header .note").textContent = "Paper trading: simulated money on live Hyperliquid prices. A copy, refreshed every 10 minutes";
}
if (IS_B_TEAM) {
  document.title = "Crypbro B-team";
  document.getElementById("page-title").textContent = "Crypbro B-team";
  teamLink.textContent = "A-team";
  teamLink.href = STATIC ? "../" : "/";
}

const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)", "var(--series-6)", "var(--series-7)", "var(--series-8)"];
// Only eight colours are validated, so accounts beyond them are patterned lines in the text colour.
const EXTRA_LINES = [{dash: "6 4", label: "dashed"}, {dash: "1 5", label: "dotted"}];
const seriesColor = i => SERIES[i] || "var(--text)";
const seriesDash = i => i < SERIES.length ? "none" : EXTRA_LINES[i - SERIES.length].dash;
const seriesNote = i => i < SERIES.length ? "" : ` (${EXTRA_LINES[i - SERIES.length].label})`;
const $ = id => document.getElementById(id);
const usd = v => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const signedUsd = v => (v > 0 ? "+" : "") + usd(v);
const pct = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const px = v => v == null ? "—" : v.toLocaleString(undefined, {maximumSignificantDigits: 6});
const when = ms => new Date(ms).toLocaleString(undefined, {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const sideText = t => t > 0 ? "Long" : t < 0 ? "Short" : "Exit";
const tone = v => v > 0 ? "pos" : v < 0 ? "neg" : "";

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? node.className = v : node.setAttribute(k, v);
  node.append(...children);
  return node;
}

function renderStatus(hb) {
  const box = $("status");
  box.replaceChildren();
  if (!hb) { box.textContent = "Waiting for the first update"; return; }
  const age = (Date.now() - hb.time_ms) / 60000;
  const state = age > (STATIC ? 25 : 5) ? ["bad", "Offline"] : hb.status !== "ok" ? ["warn", "Having trouble"] : ["ok", "Running"];
  box.append(el("b", {class: state[0]}, state[1]), ` · updated ${Math.max(0, Math.round(age))} min ago`);
  if (hb.status !== "ok" && hb.message) box.append(` · ${hb.message}`);
}

function renderCards(accounts) {
  $("cards").replaceChildren(...accounts.map(a => {
    const change = a.equity - a.initial_equity;
    const list = el("dl");
    const add = (k, v, cls) => list.append(el("dt", {}, k), el("dd", cls ? {class: cls} : {}, v));
    add("Open / waiting", `${a.open_positions} / ${a.pending}`);
    add("Leverage", a.gross_leverage.toFixed(2) + "x");
    add("Closed trades", a.closed_trades ? `${a.closed_trades} (${Math.round(a.wins / a.closed_trades * 100)}% won)` : "0");
    add("Fees + slippage", usd(a.fees + a.slippage));
    add("Funding", signedUsd(a.funding));
    if (a.withdrawn) add("Withdrawn gain", `${usd(a.withdrawn)} (${pct(a.withdrawn / a.initial_equity * 100)})`, "withdrawn");
    return el("article", {class: "card"},
      el("h3", {}, el("span", {class: "key", style: `background:${seriesColor(a.series)}`}), a.name),
      el("div", {class: "sub"}, `${a.strategy.replaceAll("_", " ")}, ${a.timeframe} candles, ${a.trailing ? "trailing" : "fixed"} stops${a.ruined ? " · account wiped out" : ""}`),
      el("div", {class: "headline"},
        el("span", {class: "big"}, usd(a.equity)),
        el("span", {class: "delta"}, `${pct(change / a.initial_equity * 100)} (${signedUsd(change)})`)),
      list);
  }));
}

let chartData = null;
function renderChart(accounts, curves) {
  $("legend").replaceChildren(...accounts.map(a =>
    el("span", {}, el("span", {class: "key", style: `background:${seriesColor(a.series)}`}), a.name + seriesNote(a.series))));
  chartData = accounts.map(a => ({
    name: a.name, color: seriesColor(a.series), dash: seriesDash(a.series),
    points: (curves[a.name] || []).map(p => ({t: p.time_ms, r: (p.equity / (a.chart_base || a.initial_equity) - 1) * 100})),
  }));
  drawChart();
}

const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

function niceTicks(lo, hi, count) {
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step / 1e6; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

function drawChart() {
  const svg = $("plot"), tip = $("tip");
  svg.replaceChildren();
  tip.style.display = "none";
  const all = chartData ? chartData.flatMap(s => s.points) : [];
  const box = svg.getBoundingClientRect();
  const W = box.width, H = box.height;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  // A line needs two readings at different times, in at least one account.
  if (!chartData || !chartData.some(s => s.points.length >= 2)) {
    svg.append(svgEl("text", {x: W / 2, y: H / 2, "text-anchor": "middle", fill: "var(--text-2)", "font-size": 13},
      "The chart fills in as readings arrive, every 5 minutes"));
    return;
  }
  // Wide screens get a name at the end of each line, so lines aren't identified by colour alone.
  const directLabels = W >= 560;
  const m = {l: 52, r: directLabels ? 182 : 16, t: 10, b: 26};
  const tMin = Math.min(...all.map(p => p.t)), tMax = Math.max(...all.map(p => p.t));
  let lo = Math.min(0, ...all.map(p => p.r)), hi = Math.max(0, ...all.map(p => p.r));
  const span = Math.max(hi - lo, 0.2);
  lo -= span * 0.08; hi += span * 0.08;
  const x = t => m.l + (t - tMin) / Math.max(tMax - tMin, 1) * (W - m.l - m.r);
  const y = r => m.t + (hi - r) / (hi - lo) * (H - m.t - m.b);

  for (const v of niceTicks(lo, hi, 5)) {
    svg.append(svgEl("line", {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--text-3)" : "var(--grid)", "stroke-width": 1}));
    svg.append(svgEl("text", {x: m.l - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--text-3)", "font-size": 11}, (v > 0 ? "+" : "") + v + "%"));
  }
  const xCount = Math.max(1, Math.min(tMax - tMin < 1800000 ? 1 : 6, Math.floor((W - m.l - m.r) / 130)));
  for (let i = 0; i <= xCount; i++) {
    const t = tMin + (tMax - tMin) * i / xCount;
    svg.append(svgEl("text", {x: x(t), y: H - 7, "text-anchor": i === 0 ? "start" : i === xCount ? "end" : "middle", fill: "var(--text-3)", "font-size": 11}, when(t)));
  }
  for (const s of chartData) {
    if (s.points.length < 2) continue;
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)} ${y(p.r).toFixed(1)}`).join("");
    svg.append(svgEl("path", {d, fill: "none", stroke: s.color, "stroke-dasharray": s.dash, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
  }
  if (directLabels) {
    const labels = chartData.filter(s => s.points.length >= 2)
      .map(s => ({name: s.name, y: y(s.points[s.points.length - 1].r)}))
      .sort((a, b) => a.y - b.y);
    // Nudge labels apart when lines finish close together, then keep them on the plot.
    labels.forEach((l, i) => { if (i && l.y - labels[i - 1].y < 14) l.y = labels[i - 1].y + 14; });
    const overflow = labels.length ? labels[labels.length - 1].y - (H - m.b) : 0;
    if (overflow > 0) labels.forEach(l => { l.y -= overflow; });
    for (const l of labels) {
      svg.append(svgEl("text", {x: W - m.r + 8, y: l.y + 4, fill: "var(--text-2)", "font-size": 11}, l.name));
    }
  }
  const cross = svgEl("line", {y1: m.t, y2: H - m.b, stroke: "var(--text-3)", "stroke-width": 1, visibility: "hidden"});
  svg.append(cross);
  const dots = chartData.map(s => {
    const c = svgEl("circle", {r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden"});
    svg.append(c);
    return c;
  });
  const hit = svgEl("rect", {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent"});
  svg.append(hit);
  const nearest = (pts, t) => pts.reduce((b, p) => Math.abs(p.t - t) < Math.abs(b.t - t) ? p : b, pts[0]);
  hit.addEventListener("pointermove", e => {
    const rect = svg.getBoundingClientRect();
    const t = tMin + (e.clientX - rect.left - m.l) / (W - m.l - m.r) * (tMax - tMin);
    const found = chartData.map((s, i) => ({s, i, p: s.points.length ? nearest(s.points, t) : null})).filter(r => r.p);
    if (!found.length) return;
    // The time shown is the reading closest to the pointer, from whichever account has one. Accounts with no reading
    // near that time (one that started later or stopped earlier) are left out, rather than pinning the time to their ends.
    const at = found.reduce((b, r) => Math.abs(r.p.t - t) < Math.abs(b.p.t - t) ? r : b).p.t;
    const near = Math.max(15 * 60000, (tMax - tMin) / 200);
    const rows = found.filter(r => Math.abs(r.p.t - at) <= near);
    const tx = x(at);
    cross.setAttribute("x1", tx); cross.setAttribute("x2", tx); cross.setAttribute("visibility", "visible");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
    for (const {i, p} of rows) {
      dots[i].setAttribute("cx", x(p.t)); dots[i].setAttribute("cy", y(p.r)); dots[i].setAttribute("visibility", "visible");
    }
    tip.replaceChildren(el("div", {style: "color:var(--text-2);margin-bottom:4px"}, when(at)),
      ...rows.map(({s, p}) => el("div", {class: "row"}, el("span", {class: "key", style: `background:${s.color}`}), s.name, el("b", {}, pct(p.r)))));
    tip.style.display = "block";
    const chartBox = $("chart").getBoundingClientRect();
    const left = e.clientX - chartBox.left;
    tip.style.left = (left > chartBox.width / 2 ? left - tip.offsetWidth - 14 : left + 14) + "px";
    tip.style.top = (rect.top - chartBox.top + 16) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
    tip.style.display = "none";
  });
}

// Not a paper account: the three signs come from the market recorders and are checked every 15 minutes.
const WATCH_STALE_MIN = 45;
function renderWatch(w) {
  const link = $("watch-link"), note = $("watch-note"), box = $("signs");
  const about = "Three signs that Bitcoin's fall may be ending. Market readings, not a model, and none is a tested buy signal.";
  if (!w) {
    link.className = "note"; link.textContent = "Low watch";
    note.textContent = about;
    box.replaceChildren(el("div", {class: "empty"}, "Waiting for the first check"));
    return;
  }
  const age = Math.max(0, Math.round((Date.now() - w.checked_ms) / 60000));
  const stale = age > WATCH_STALE_MIN, on = w.signs.filter(s => s.on).length;
  link.className = "note" + (stale ? " stale" : on ? " on" : "");
  link.textContent = stale ? `Low watch: not checked for ${age} min` : `Low watch: ${on} of ${w.signs.length} signs`;
  note.textContent = `${about} Checked every 15 minutes, last at ${when(w.checked_ms)}${stale ? ", so these readings are old" : ""}.`;
  box.replaceChildren(...w.signs.map(s => {
    const state = s.verdict === "blind" ? ["stale", "No fresh readings"] : s.on ? ["pos", `True since ${when(s.since_ms)}`] : ["", "Not yet"];
    return el("article", {class: "sign"},
      el("h3", {}, s.title),
      el("div", {class: `state ${state[0]}`}, state[1]),
      el("div", {class: "detail"}, s.detail.charAt(0).toUpperCase() + s.detail.slice(1)));
  }));
}

function renderTable(id, headers, rows, empty) {
  const table = $(id);
  if (!rows.length) {
    table.replaceChildren(el("tbody", {}, el("tr", {}, el("td", {class: "empty"}, empty))));
    return;
  }
  const head = el("thead", {}, el("tr", {}, ...headers.map(h => el("th", {scope: "col", class: h.n ? "n" : ""}, h.t))));
  const body = el("tbody", {}, ...rows.map(r => el("tr", {}, ...r.map((c, i) => {
    const [text, cls] = Array.isArray(c) ? c : [c, ""];
    return el("td", {class: `${headers[i].n ? "n " : ""}${cls}`}, text);
  }))));
  table.replaceChildren(head, body);
}

function render(d) {
  renderStatus(d.heartbeat);
  renderCards(d.accounts);
  renderChart(d.accounts, d.curves);
  const positions = [...d.positions].sort((a, b) => a.account.localeCompare(b.account) || b.notional - a.notional);
  renderTable("positions",
    [{t: "Account"}, {t: "Coin"}, {t: "Side"}, {t: "Size", n: 1}, {t: "Entry", n: 1}, {t: "Now", n: 1}, {t: "Stop", n: 1}, {t: "Profit / loss", n: 1}],
    positions.map(p => [p.account, p.coin, [p.side === "long" ? "Long" : "Short", p.side], usd(p.notional), px(p.entry_px), px(p.mark_px), px(p.stop_px), [signedUsd(p.pnl), tone(p.pnl)]]),
    "No open positions yet");
  renderTable("signals",
    [{t: "Time"}, {t: "Account"}, {t: "Coin"}, {t: "Signal"}, {t: "Price", n: 1}, {t: "Stop distance", n: 1}, {t: "Simulated fill at"}],
    d.signals.map(s => [when(s.time_ms), s.account, s.coin, sideText(s.target), px(s.price), s.stop_pct == null ? "—" : (s.stop_pct * 100).toFixed(1) + "%", when(s.due_ms)]),
    "No signals yet");
  renderTable("trades",
    [{t: "Closed"}, {t: "Account"}, {t: "Coin"}, {t: "Side"}, {t: "Entry", n: 1}, {t: "Exit", n: 1}, {t: "Why"}, {t: "Net result", n: 1}],
    d.trades.map(t => [when(t.exit_time), t.account, t.symbol, t.side === "long" ? "Long" : "Short", px(t.entry_px), px(t.exit_px), t.exit_reason.replaceAll("_", " "), [signedUsd(t.net_pnl), tone(t.net_pnl)]]),
    "No closed trades yet");
  renderWatch(d.low_watch);
}

let pageVersion = null;
async function refresh() {
  try {
    const response = await fetch(STATIC ? `state.json?t=${Date.now()}` : IS_B_TEAM ? "/api/state?team=b" : "/api/state");
    if (!response.ok) throw new Error(response.status);
    const state = await response.json();
    // An open tab keeps running old code, so pick up a newer page when there is one.
    if (pageVersion !== null && state.page_version !== pageVersion) { location.reload(); return; }
    pageVersion = state.page_version;
    render(state);
  } catch {
    const box = $("status");
    box.replaceChildren(el("b", {class: "bad"}, "Dashboard can't read the trader's data"));
  }
}
refresh();
setInterval(refresh, 30000);
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });
</script>
</body>
</html>
